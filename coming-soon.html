  <!-- Mobile Slide-Out Menu -->

        <button class="mobile-dropbtn">Programs ▾</button>

  <div class="coming-soon-wrapper">
    <h1 class="coming-soon-title">Something Powerful Is Coming Soon</h1>
    <p class="coming-soon-text">
      We’re getting everything ready behind the scenes. Stay tuned.
    </p>
  </div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const hamburger = document.getElementById("hamburger");
  const mobileMenu = document.getElementById("mobileMenu");
  const mobileDropdownBtns = document.querySelectorAll(".mobile-dropbtn");

  console.log("hamburger:", hamburger);
  console.log("mobileMenu:", mobileMenu);

  if (!hamburger || !mobileMenu) {
    console.warn("Nav elements not found on this page.");
    return;
  }

  hamburger.addEventListener("click", () => {
    const isOpen = mobileMenu.style.display === "block";
    mobileMenu.style.display = isOpen ? "none" : "block";
    console.log("Hamburger clicked. Menu open:", !isOpen);
  });

  mobileDropdownBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const content = btn.nextElementSibling;
      if (!content) return;
      const isOpen = content.style.display === "block";
      content.style.display = isOpen ? "none" : "block";
    });
  });
});
</script>

</body>
